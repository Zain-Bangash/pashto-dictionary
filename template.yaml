AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256

Parameters:
  MongodbUri:
    Type: String
    NoEcho: true
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CognitoClientSecret:
    Type: String
    NoEcho: true
  FrontendOrigin:
    Type: String
    Default: https://main.d1jgu2lev5krpe.amplifyapp.com
  # 'none' while the API is cross-site from Amplify; 'strict' once Amplify proxies /api/*
  CookieSameSite:
    Type: String
    Default: strict
    AllowedValues: [strict, lax, none]
  # S3-compatible object storage for pronunciation clips (Cloudflare R2)
  StorageEndpoint:
    Type: String
  StorageRegion:
    Type: String
    Default: auto
  StorageBucket:
    Type: String
  StorageAccessKeyId:
    Type: String
    NoEcho: true
  StorageSecretAccessKey:
    Type: String
    NoEcho: true

Resources:
  PashtoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Tags: {}
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref FrontendOrigin]
        AllowCredentials: true
        AllowHeaders: [content-type, authorization, x-requested-with]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 600

  PashtoBackend:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.lambdaHandler
      CodeUri: server/
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongodbUri
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_CLIENT_SECRET: !Ref CognitoClientSecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          COOKIE_SAMESITE: !Ref CookieSameSite
          STORAGE_ENDPOINT: !Ref StorageEndpoint
          STORAGE_REGION: !Ref StorageRegion
          STORAGE_BUCKET: !Ref StorageBucket
          STORAGE_ACCESS_KEY_ID: !Ref StorageAccessKeyId
          STORAGE_SECRET_ACCESS_KEY: !Ref StorageSecretAccessKey
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminDeleteUser
                - cognito-idp:InitiateAuth
                - cognito-idp:RevokeToken
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PashtoApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        EntryPoints:
          - src/lambda.ts

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${PashtoApi}.execute-api.${AWS::Region}.amazonaws.com'
