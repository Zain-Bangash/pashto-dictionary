name: Deploy

# Tests must pass on the PR (via ci.yml) before merging to main.

on:
  push:
    branches:
      - main

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: sam build

      - run: |
          sam deploy --no-confirm-changeset \
            --parameter-overrides \
              MongodbUri="${{ secrets.MONGODB_URI }}" \
              CognitoUserPoolId="${{ secrets.COGNITO_USER_POOL_ID }}" \
              CognitoClientId="${{ secrets.COGNITO_CLIENT_ID }}" \
              CognitoClientSecret="${{ secrets.COGNITO_CLIENT_SECRET }}"
